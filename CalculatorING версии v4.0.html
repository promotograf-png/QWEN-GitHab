<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График работы инженеров _v4.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        label {
            font-weight: 500;
        }
        
        input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 80px;
        }
        
        button {
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #1976D2;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        
        .table-container {
            overflow-x: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            background: #f5f5f5;
            padding: 10px 8px;
            text-align: center;
            font-weight: 600;
            border: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: center;
            min-width: 100px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        td:hover {
            filter: brightness(0.95);
        }
        
        td:focus {
            outline: 2px solid #2196F3;
            outline-offset: -2px;
        }
        
        .col-date, .col-day {
            background: #fafafa;
            font-weight: 500;
            min-width: 60px;
        }
        
        .col-bs { background: white; }
        .col-ms { background: white; }
        .col-ks { background: white; }
        .col-zrk { background: white; }
        .col-tg { background: white; }
        .col-inj1 { background: #e8f5e9; }
        .col-inj2 { background: #ffe8e1; }
        .col-inj3 { background: #fffde7; }
        .col-status {
            background: #fafafa;
            min-width: 200px;
            text-align: left !important;
            font-size: 12px;
            vertical-align: top;
            padding: 8px;
        }
        .status-error {
            background: #ffebee;
            color: #c62828;
            font-weight: 500;
        }
        
        .editable {
            cursor: text;
        }
        
        .empty-row {
            background: #f9f9f9;
        }
        
        /* Стили для строк счетчиков */
        .counter-row {
            background: #f0f0f0;
            font-weight: 600;
        }
        
        .counter-label {
            text-align: right !important;
            padding-right: 15px !important;
            background: #e8e8e8 !important;
            font-weight: 600;
        }
        
        .counter-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            cursor: default !important;
        }
        
        .counter-value:hover {
            filter: none !important;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }

        /* Счётчики в <tfoot> — ТЗ п. 5.1–5.3 */
        #counterFoot td {
            background: #f5f5f5;
            font-weight: bold;
            cursor: default !important;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }
        #counterFoot .counter-foot-label {
            text-align: right !important;
            padding-right: 15px !important;
        }
        #counterFoot td:hover {
            filter: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">График работы инженеров _v4.0</div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="month">Месяц:</label>
                    <input type="number" id="month" min="1" max="12" value="10">
                </div>
                
                <div class="control-group">
                    <label for="year">Год:</label>
                    <input type="number" id="year" min="2020" max="2030" value="2026">
                </div>
                
                <button id="generateBtn">Сгенерировать</button>
                
                <div class="file-input-wrapper">
                    <button id="loadRepertoireBtn">Загрузить Репертуар</button>
                    <input type="file" id="fileInput" accept=".xlsx,.xls">
                </div>
                
                <div class="control-group">
                    <label for="gsheetUrl">График на Google:</label>
                    <input type="text" id="gsheetUrl" placeholder="URL Web App" style="width: 250px;">
                </div>

                <button id="exportBtn">Опубликовать в Гугл-таблицах</button>
            </div>
            
            <div id="status" class="status"></div>
        </div>
        
        <div class="table-container">
            <table id="scheduleTable">
                <thead>
                    <tr>
                        <th>Число</th>
                        <th>День</th>
                        <th>БС</th>
                        <th>МС</th>
                        <th>КС</th>
                        <th>ЗРК</th>
                        <th>ТГ</th>
                        <th>ИНЖ1</th>
                        <th>ИНЖ2</th>
                        <th>ИНЖ3</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
                <tfoot id="counterFoot">
                    <tr>
                        <td class="counter-foot-label" colspan="7">Баллы инж:</td>
                        <td class="counter-foot-value" data-counter-type="ballInj" data-engineer="inj1">0</td>
                        <td class="counter-foot-value" data-counter-type="ballInj" data-engineer="inj2">0</td>
                        <td class="counter-foot-value" data-counter-type="ballInj" data-engineer="inj3">0</td>
                        <td class="counter-foot-status"></td>
                    </tr>
                    <tr>
                        <td class="counter-foot-label" colspan="7">Баллы тех:</td>
                        <td class="counter-foot-value" data-counter-type="ballTech" data-engineer="inj1">0</td>
                        <td class="counter-foot-value" data-counter-type="ballTech" data-engineer="inj2">0</td>
                        <td class="counter-foot-value" data-counter-type="ballTech" data-engineer="inj3">0</td>
                        <td class="counter-foot-status"></td>
                    </tr>
                    <tr>
                        <td class="counter-foot-label" colspan="7">Рабочих дней:</td>
                        <td class="counter-foot-value" data-counter-type="workdays" data-engineer="inj1">0</td>
                        <td class="counter-foot-value" data-counter-type="workdays" data-engineer="inj2">0</td>
                        <td class="counter-foot-value" data-counter-type="workdays" data-engineer="inj3">0</td>
                        <td class="counter-foot-status"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script>
        // Глобальное состояние
        let currentMonth = 10;
        let currentYear = 2026;
        let scheduleData = [];
        let repertoire = {}; // Ключ: название в UPPERCASE, значение: объект {ball_inj, ball_tech, eng_count, zn1, zn2, zn3}
        let currentCell = null;

        const DAYS_OF_WEEK = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 
                       'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            generateTable();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('generateBtn').addEventListener('click', generateTable);
            document.getElementById('loadRepertoireBtn').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });
            document.getElementById('fileInput').addEventListener('change', handleFileUpload);
            document.getElementById('exportBtn').addEventListener('click', exportToGoogleSheets);
            document.getElementById('gsheetUrl').addEventListener('change', saveToLocalStorage);
            
            // Глобальная обработка клавиш
            document.addEventListener('keydown', handleKeyboardNavigation);
        }

        function generateTable() {
            currentMonth = parseInt(document.getElementById('month').value);
            currentYear = parseInt(document.getElementById('year').value);
            
            if (!currentMonth || currentMonth < 1 || currentMonth > 12) {
                showStatus('Неверный месяц', 'error');
                return;
            }
            
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            // Инициализируем массив данных если он пустой
            if (scheduleData.length === 0 || scheduleData[0]?.month !== currentMonth) {
                scheduleData = [];
            }
            
            // Создаем 35 строк (31 день + 4 резервные)
            for (let i = 0; i < 35; i++) {
                const row = document.createElement('tr');
                const dayNumber = i + 1;
                
                if (dayNumber <= daysInMonth) {
                    const date = new Date(currentYear, currentMonth - 1, dayNumber);
                    const dayOfWeek = DAYS_OF_WEEK[date.getDay()];
                    
                    // Ячейка с числом
                    const dateCell = document.createElement('td');
                    dateCell.className = 'col-date';
                    dateCell.textContent = dayNumber;
                    row.appendChild(dateCell);
                    
                    // Ячейка с днем недели
                    const dayCell = document.createElement('td');
                    dayCell.className = 'col-day';
                    dayCell.textContent = dayOfWeek;
                    row.appendChild(dayCell);
                    
                    // Ячейки площадок и инженеров
                    const columns = ['bs', 'ms', 'ks', 'zrk', 'tg', 'inj1', 'inj2', 'inj3'];
                    columns.forEach((col, idx) => {
                        const cell = document.createElement('td');
                        cell.className = `col-${col} editable`;
                        cell.contentEditable = true;
                        cell.dataset.row = i;
                        cell.dataset.col = idx + 2; // +2 потому что первые 2 колонки - число и день
                        cell.dataset.type = col;
                        
                        // Загружаем сохраненные данные
                        const savedData = scheduleData.find(d => d.day === dayNumber && d.column === col);
                        if (savedData) {
                            cell.textContent = savedData.value;
                        }
                        
                        cell.addEventListener('click', () => {
                            currentCell = cell;
                            placeCaretAtEnd(cell);
                        });
                        
                        cell.addEventListener('blur', () => {
                            saveCellData(cell);
                        });
                        
                        row.appendChild(cell);
                    });
                    
                    // Ячейка статуса (колонка K)
                    const statusCell = document.createElement('td');
                    statusCell.className = 'col-status';
                    statusCell.dataset.row = i;
                    statusCell.dataset.col = 10;
                    statusCell.dataset.type = 'status';
                    statusCell.contentEditable = false;
                    row.appendChild(statusCell);
                } else {
                    // Пустые строки
                    row.className = 'empty-row';
                    for (let j = 0; j < 11; j++) {
                        const cell = document.createElement('td');
                        if (j === 0) {
                            cell.className = 'col-date';
                        } else if (j === 1) {
                            cell.className = 'col-day';
                        } else if (j === 10) {
                            cell.className = 'col-status';
                        } else {
                            cell.className = `col-${['bs', 'ms', 'ks', 'zrk', 'tg', 'inj1', 'inj2', 'inj3'][j-2]}`;
                        }
                        cell.textContent = '';
                        row.appendChild(cell);
                    }
                }
                
                tableBody.appendChild(row);
            }
            
            showStatus(`Таблица сгенерирована для ${MONTHS[currentMonth - 1]} ${currentYear}`, 'success');
        }

        function saveCellData(cell) {
            const row = parseInt(cell.dataset.row);
            const col = cell.dataset.type;
            const value = cell.textContent.trim();
            const dayNumber = row + 1;
            
            // Удаляем старую запись
            scheduleData = scheduleData.filter(d => !(d.day === dayNumber && d.column === col));
            
            // Добавляем новую если есть значение
            if (value) {
                scheduleData.push({
                    day: dayNumber,
                    column: col,
                    value: value,
                    month: currentMonth,
                    year: currentYear
                });
            }
            
            saveToLocalStorage();

            // Комплексный пересчёт строки: статус, цвета площадок, цвета инженеров
            recalculateRow(row);
        }

        function handleKeyboardNavigation(e) {
            if (!currentCell) return;
            
            const row = parseInt(currentCell.dataset.row);
            const col = parseInt(currentCell.dataset.col);
            
            // Проверяем, что это редактируемая ячейка (не счетчик)
            if (!currentCell.classList.contains('editable')) return;
            
            let nextCell = null;
            
            switch(e.key) {
                case 'ArrowLeft':
                    if (col > 2) {
                        nextCell = document.querySelector(`td[data-row="${row}"][data-col="${col - 1}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'ArrowRight':
                    if (col < 9) {
                        nextCell = document.querySelector(`td[data-row="${row}"][data-col="${col + 1}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'ArrowUp':
                    if (row > 0) {
                        nextCell = document.querySelector(`td[data-row="${row - 1}"][data-col="${col}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'ArrowDown':
                    if (row < 34) {
                        nextCell = document.querySelector(`td[data-row="${row + 1}"][data-col="${col}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'Tab':
                    if (col < 9) {
                        nextCell = document.querySelector(`td[data-row="${row}"][data-col="${col + 1}"]`);
                    } else if (row < 34) {
                        nextCell = document.querySelector(`td[data-row="${row + 1}"][data-col="2"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'Enter':
                    if (row < 34) {
                        nextCell = document.querySelector(`td[data-row="${row + 1}"][data-col="${col}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'Delete':
                    currentCell.textContent = '';
                    saveCellData(currentCell);
                    e.preventDefault();
                    break;
            }
            
            if (nextCell && nextCell.classList.contains('editable')) {
                saveCellData(currentCell);
                currentCell = nextCell;
                nextCell.focus();
                placeCaretAtEnd(nextCell);
            }
        }

        function placeCaretAtEnd(el) {
            el.focus();
            if (window.getSelection && document.createRange) {
                const range = document.createRange();
                range.selectNodeContents(el);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    
                    processRepertoireData(jsonData);
                    showStatus('Репертуар успешно загружен', 'success');
                } catch (error) {
                    showStatus('Ошибка при загрузке файла: ' + error.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processRepertoireData(data) {
            repertoire = {};
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length === 0) continue;
                const name = row[0];
                if (!name) continue;
                const normalizedName = name.toString().toUpperCase().replace(/[“”«»’’'']/g, '').trim();
                if (!normalizedName) continue;
                const ball_inj = parseFloat(row[1]) || 0;
                const ball_tech = parseFloat(row[2]) || 0;
                const eng_count = parseInt(row[3]) || 1;
                const zn1 = row[4] ? row[4].toString().trim() : '+';
                const zn2 = row[5] ? row[5].toString().trim() : '+';
                const zn3 = row[6] ? row[6].toString().trim() : '+';
                repertoire[normalizedName] = {
                    ball_inj: ball_inj,
                    ball_tech: ball_tech,
                    eng_count: eng_count,
                    zn1: zn1,
                    zn2: zn2,
                    zn3: zn3
                };
            }
            console.log('Репертуар загружен:', repertoire);
            showStatus(`Репертуар загружен: ${Object.keys(repertoire).length} спектаклей`, 'success');
            recalculateAllRows();
        }

        function exportToGoogleSheets() {
            const gsheetUrl = document.getElementById('gsheetUrl').value.trim();
            if (!gsheetUrl) {
                alert('Пожалуйста, введите URL Web App в поле "График на Google"');
                return;
            }

            const table = document.getElementById('scheduleTable');
            let csv = [];

            // Заголовок
            const headers = [];
            table.querySelectorAll('th').forEach(th => {
                headers.push('"' + th.textContent.replace(/"/g, '""') + '"');
            });
            csv.push(headers.join(','));

            // Данные (только основные строки, без счетчиков)
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach((tr, rowIndex) => {
                // Пропускаем строки счетчиков
                if (tr.classList.contains('counter-row')) return;

                const row = [];
                tr.querySelectorAll('td').forEach(td => {
                    row.push('"' + td.textContent.replace(/"/g, '""') + '"');
                });
                csv.push(row.join(','));
            });

            const csvString = csv.join('\n');

            fetch(gsheetUrl, {
                method: 'POST',
                body: csvString
            })
            .then(response => {
                if (response.ok) {
                    showStatus('Данные успешно отправлены в Google Sheets', 'success');
                } else {
                    throw new Error('Ошибка сети');
                }
            })
            .catch(error => {
                showStatus('Ошибка отправки: ' + error.message + '. Выполняется локальное скачивание CSV.', 'error');
                const blob = new Blob(['\ufeff' + csvString], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);

                link.setAttribute('href', url);
                link.setAttribute('download', `CalculatorIHG_v3.9_${MONTHS[currentMonth - 1]}_${currentYear}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }

        function saveToLocalStorage() {
            const gsheetUrl = document.getElementById('gsheetUrl') ? document.getElementById('gsheetUrl').value : '';
            const data = {
                scheduleData: scheduleData,
                currentMonth: currentMonth,
                currentYear: currentYear,
                gsheetUrl: gsheetUrl
            };
            localStorage.setItem('engineerSchedule', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('engineerSchedule');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    scheduleData = data.scheduleData || [];
                    currentMonth = data.currentMonth || 10;
                    currentYear = data.currentYear || 2026;
                    
                    document.getElementById('month').value = currentMonth;
                    document.getElementById('year').value = currentYear;
                    if (data.gsheetUrl) {
                        document.getElementById('gsheetUrl').value = data.gsheetUrl;
                    }
                } catch (e) {
                    console.error('Ошибка загрузки из localStorage:', e);
                }
            }
        }

        function parseTimeFromEvent(eventName) {
            // Извлекает время из названия события (например, "РЕП 12" -> {hour:12, minute:0})
            if (!eventName) return null;

            // Ищем паттерн времени: число с возможными : или . и минутами
            const match = eventName.match(/(\d{1,2})[:.](\d{1,2})/);
            if (match) {
                return { hour: parseInt(match[1]), minute: parseInt(match[2]) };
            }

            const matchHour = eventName.match(/(\d{1,2})$/);
            if (matchHour) {
                return { hour: parseInt(matchHour[1]), minute: 0 };
            }

            return null; // время не найдено
        }

        function isMorningSlot(timeObj) {
            // Утро: до 15:30 включительно
            if (!timeObj) return false;
            if (timeObj.hour < 15) return true;
            if (timeObj.hour === 15 && timeObj.minute <= 30) return true;
            return false;
        }

        function isEveningSlot(hour) {
            // Вечер: после 15:30
            return hour !== null && hour > 15;
        }

        function parseVenueEvents(venueValue) {
            // Парсит ячейку площадки на отдельные события
            // Пример: "ГАМЛЕТ 19 + ОТЕЛЛО 20" -> [{name:"ГАМЛЕТ", hour:19}, {name:"ОТЕЛЛО", hour:20}]
            if (!venueValue) return [];
            const parts = venueValue.split('+').map(p => p.trim());
            const events = [];
            let lastValidName = null;
            parts.forEach(part => {
                if (!part) return;
                // Случай: только время (например, "19" или "19:00") — относится к последнему названию
                const timeOnlyMatch = part.match(/^(\d{1,2})(?::(\d{1,2}))?$/);
                if (timeOnlyMatch) {
                    if (lastValidName) {
                        const hour = parseInt(timeOnlyMatch[1]);
                        const minute = timeOnlyMatch[2] ? parseInt(timeOnlyMatch[2]) : 0;
                        events.push({ name: lastValidName, hour: hour, minute: minute, raw: part });
                    }
                    return;
                }
                // Случай: название + возможно время
                const match = part.match(/^([А-ЯЁA-Z0-9\s-]+?)(?:\s+(\d{1,2})(?::(\d{1,2}))?)?$/i);
                if (match) {
                    const name = match[1].trim().toUpperCase().replace(/[“”«»’’'']/g, '');
                    const hour = match[2] ? parseInt(match[2]) : null;
                    const minute = match[3] ? parseInt(match[3]) : 0;
                    if (name) {
                        lastValidName = name;
                        events.push({ name: name, hour: hour, minute: minute, raw: part });
                    }
                }
            });
            return events;
        }

        function checkAssignmentRules(rowIndex) {
            // Проверяет правила расстановки инженеров для всех событий в строке
            // Возвращает массив объектов {type: 'error'|'info', message: string}
            const warnings = [];
            // Собираем все события площадок этой строки
            const allVenueEvents = [];
            ['bs', 'ms', 'ks', 'zrk', 'tg'].forEach(venueCode => {
                const venueCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="${venueCode}"]`);
                if (venueCell) {
                    const venueValue = venueCell.textContent.trim();
                    const venueEvents = parseVenueEvents(venueValue);
                    venueEvents.forEach(event => {
                        const timeObj = event.hour !== null ? { hour: event.hour, minute: event.minute || 0 } : null;
                        allVenueEvents.push({
                            venue: venueCode,
                            name: event.name,
                            hour: event.hour,
                            minute: event.minute || 0,
                            slot: isMorningSlot(timeObj) ? 'morning' : 'evening'
                        });
                    });
                }
            });
            // Для каждого события проверяем назначенных инженеров
            allVenueEvents.forEach(event => {
                const repData = repertoire[event.name];
                if (!repData) return;
                const engCount = repData.eng_count;
                // Собираем назначенных инженеров на это событие (с учётом слота и площадки)
                const assignedEngineers = [];
                ['inj1', 'inj2', 'inj3'].forEach((engCol, engIndex) => {
                    const engCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="${engCol}"]`);
                    if (!engCell) return;
                    const engValue = engCell.textContent.trim().toUpperCase();
                    const engParts = engValue.split('+').map(p => p.trim());
                    const engAssignments = [];
                    engParts.forEach(engPart => {
                        if (!engPart) return;
                        let engSlot = 'evening';
                        let cleanEngPart = engPart;
                        if (engPart.startsWith('У/')) {
                            engSlot = 'morning';
                            cleanEngPart = engPart.substring(2).trim();
                        } else if (engPart.startsWith('В/')) {
                            engSlot = 'evening';
                            cleanEngPart = engPart.substring(2).trim();
                        }
                        const venueMap = { 'БС': 'bs', 'МС': 'ms', 'КС': 'ks', 'ЗРК': 'zrk', 'ТГ': 'tg' };
                        let engVenue = '';
                        for (const [rus, code] of Object.entries(venueMap)) {
                            if (cleanEngPart.includes(rus)) {
                                engVenue = code;
                                break;
                            }
                        }
                        if (engVenue === event.venue) {
                            engAssignments.push({ slot: engSlot });
                        }
                    });
                    // Инженер назначен на событие, если среди его записей этой площадки
                    // есть запись со слотом события (порядок "у/" и "в/" в ячейке не важен)
                    const matchingAssignment = engAssignments.find(a => a.slot === event.slot);
                    if (matchingAssignment) {
                        const znKey = `zn${engIndex + 1}`;
                        const znValue = repData[znKey];
                        assignedEngineers.push({
                            engineer: engCol,
                            engineerIndex: engIndex + 1,
                            knowledge: znValue
                        });
                    } else if (engAssignments.length > 0) {
                        // Есть записи на эту площадку, но ни одна не совпала со слотом события — блокирующая ошибка
                        const expectedSlotText = event.slot === 'morning' ? 'утро' : 'вечер';
                        const actualSlots = engAssignments.map(a => a.slot === 'morning' ? 'утро' : 'вечер').join(', ');
                        const timeText = event.hour + (event.minute > 0 ? ':' + (event.minute < 10 ? '0' + event.minute : event.minute) : ':00');
                        warnings.push({
                            type: 'error',
                            message: `Ошибка слота: ${timeText} - ${expectedSlotText}, а вы указали ${actualSlots}`
                        });
                    }
                });
                // Если никто не назначен — пропускаем (это не ошибка расстановки)
                if (assignedEngineers.length === 0) return;
                // Подсчитываем опытных (+) и учеников (0, 1, 2)
                const experienced = assignedEngineers.filter(e => e.knowledge === '+');
                const students = assignedEngineers.filter(e => e.knowledge !== '+' && e.knowledge !== undefined);
                // БЛОКИРУЮЩАЯ ОШИБКА 1: Нет опытного
                if (experienced.length === 0) {
                    assignedEngineers.forEach(eng => {
                        warnings.push({
                            type: 'error',
                            message: `инж${eng.engineerIndex}: ОПЫТ ${eng.knowledge} (недопустимо)`
                        });
                    });
                    return; // дальше не проверяем — уже блокирующая ошибка
                }
                // БЛОКИРУЮЩАЯ ОШИБКА 2: Второй лишний (eng_count = 1, два и более профи — лишний второй)
                if (engCount === 1) {
                    const plusCount = assignedEngineers.filter(eng => eng.knowledge === '+').length;
                    if (plusCount >= 2) {
                        warnings.push({
                            type: 'error',
                            message: 'Второй лишний'
                        });
                        return;
                    }
                }
                // БЛОКИРУЮЩАЯ ОШИБКА 3: Третий лишний (eng_count = 2, назначено 3, все опытные)
                if (engCount === 2 && assignedEngineers.length === 3) {
                    // Считаем, сколько из троих назначенных инженеров имеют статус "+"
                    const plusCount = assignedEngineers.filter(eng => eng.knowledge === '+').length;
                    // Ошибка "Третий лишний" ТОЛЬКО если все трое имеют статус "+"
                    if (plusCount === 3) {
                        warnings.push({
                            type: 'error',
                            message: 'Третий лишний'
                        });
                        return;
                    }
                    // Если plusCount < 3 (например, 2 плюса + 1 ученик), ошибки НЕТ — это норма по ТЗ п. 5.5
                }
                // ИНФОРМАЦИОННЫЕ СООБЩЕНИЯ: ученики под руководством опытного
                students.forEach(eng => {
                    warnings.push({
                        type: 'info',
                        message: `инж${eng.engineerIndex}: ОПЫТ ${eng.knowledge}`
                    });
                });
            });
            return warnings;
        }

        function updateRowStatus(rowIndex) {
            // Вызывает проверку расстановки и обновляет ячейку «Статус»
            const warnings = checkAssignmentRules(rowIndex);
            const statusCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="status"]`);
            if (!statusCell) return;
            if (warnings.length === 0) {
                statusCell.innerHTML = '';
                statusCell.classList.remove('status-error');
                return;
            }
            const hasError = warnings.some(w => w.type === 'error');
            statusCell.innerHTML = warnings.map(w => w.message).join('<br>');
            if (hasError) {
                statusCell.classList.add('status-error');
            } else {
                statusCell.classList.remove('status-error');
            }
        }

        function recalculateRow(rowIndex) {
            updateRowStatus(rowIndex);
            updateVenueColors(rowIndex);
            updateEngineerColors(rowIndex);
            updateFootCounters();
        }

        // Расчёт баллов инженера по строке — ТЗ п. 5 (Задание 5, v3.7)
        function calculateEngineerPoints(rowIndex, engIndex) {
            // engIndex: 1..3 (ИНЖ1, ИНЖ2, ИНЖ3)
            const engCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="inj${engIndex}"]`);
            if (!engCell) return { ballInj: 0, ballTech: 0, hasValidEvent: false };
            const engText = engCell.textContent.trim();
            if (!engText) return { ballInj: 0, ballTech: 0, hasValidEvent: false };

            const parts = engText.split('+').filter(p => p.trim());
            let totalBallInj = 0;
            let totalBallTech = 0;
            let hasValid = false;

            parts.forEach(part => {
                const trimmed = part.trim();
                if (!trimmed) return;
                let slot = 'evening';
                let name = trimmed;
                if (trimmed.startsWith('У/') || trimmed.startsWith('у/')) {
                    slot = 'morning';
                    name = trimmed.substring(2);
                } else if (trimmed.startsWith('В/') || trimmed.startsWith('в/')) {
                    slot = 'evening';
                    name = trimmed.substring(2);
                }
                const venueMap = { 'БС': 'bs', 'МС': 'ms', 'КС': 'ks', 'ЗРК': 'zrk', 'ТГ': 'tg' };
                let venueKey = '';
                for (const key in venueMap) {
                    if (name.toUpperCase().startsWith(key)) {
                        venueKey = key;
                        break;
                    }
                }
                if (!venueKey) return;

                const venueCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="${venueMap[venueKey]}"]`);
                if (!venueCell) return;
                const venueEvents = parseVenueEvents(venueCell.textContent);
                const matchingEvents = venueEvents.filter(ev => {
                    if (ev.hour === null) return false;
                    const evSlot = isMorningSlot({ hour: ev.hour, minute: ev.minute || 0 }) ? 'morning' : 'evening';
                    return evSlot === slot;
                });

                matchingEvents.forEach(ev => {
                    const evName = ev.name.toUpperCase();
                    const rep = repertoire[evName];
                    if (!rep) return;
                    hasValid = true;

                    const znKey = `zn${engIndex}`;
                    const engStatus = rep[znKey];
                    const isExperienced = engStatus === '+' || engStatus === 'plus';

                    // Кто назначен на это же событие (тот же слот и площадка)
                    const assigned = [];
                    for (let i = 1; i <= 3; i++) {
                        const otherCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="inj${i}"]`);
                        if (!otherCell) continue;
                        const otherText = otherCell.textContent.trim();
                        if (!otherText) continue;
                        const otherParts = otherText.split('+').filter(p => p.trim());
                        otherParts.forEach(op => {
                            const opTrimmed = op.trim();
                            if (!opTrimmed) return;
                            let opSlot = 'evening';
                            let opName = opTrimmed;
                            if (opTrimmed.startsWith('У/') || opTrimmed.startsWith('у/')) {
                                opSlot = 'morning';
                                opName = opTrimmed.substring(2);
                            } else if (opTrimmed.startsWith('В/') || opTrimmed.startsWith('в/')) {
                                opSlot = 'evening';
                                opName = opTrimmed.substring(2);
                            }
                            if (opName.toUpperCase().startsWith(venueKey) && opSlot === slot) {
                                const otherZnKey = `zn${i}`;
                                const otherStatus = rep[otherZnKey];
                                const otherIsExp = otherStatus === '+' || otherStatus === 'plus';
                                assigned.push({ isExperienced: otherIsExp });
                            }
                        });
                    }

                    const engCount = rep.eng_count;
                    const studentCount = assigned.filter(a => !a.isExperienced).length;

                    let injMult = 1;
                    let techMult = 1;
                    if (!isExperienced) {
                        if (engCount === 1) {
                            injMult = 0.5;
                            techMult = 0.5;
                        } else if (engCount === 2) {
                            if (studentCount === 1) {
                                injMult = 1;
                                techMult = 1;
                            } else if (studentCount === 2) {
                                injMult = 0.5;
                                techMult = 0.5;
                            }
                        }
                    }

                    totalBallInj += rep.ball_inj * injMult;
                    totalBallTech += rep.ball_tech * techMult;
                });
            });

            return { ballInj: totalBallInj, ballTech: totalBallTech, hasValidEvent: hasValid };
        }

        // Пересчёт счётчиков в <tfoot> — ТЗ п. 5.1–5.3 (Задание 5, v3.7)
        function updateFootCounters() {
            const injCells = document.querySelectorAll('tfoot td[data-counter-type="ballInj"]');
            const techCells = document.querySelectorAll('tfoot td[data-counter-type="ballTech"]');
            const daysCells = document.querySelectorAll('tfoot td[data-counter-type="workdays"]');
            injCells.forEach(c => c.textContent = '0');
            techCells.forEach(c => c.textContent = '0');
            daysCells.forEach(c => c.textContent = '0');

            const rows = document.querySelectorAll('tbody tr');
            rows.forEach((row, rowIndex) => {
                for (let engIndex = 1; engIndex <= 3; engIndex++) {
                    const result = calculateEngineerPoints(rowIndex, engIndex);
                    const injCell = document.querySelector(`tfoot td[data-counter-type="ballInj"][data-engineer="inj${engIndex}"]`);
                    if (injCell) {
                        const current = parseFloat(injCell.textContent) || 0;
                        injCell.textContent = (current + result.ballInj).toString();
                    }
                    const techCell = document.querySelector(`tfoot td[data-counter-type="ballTech"][data-engineer="inj${engIndex}"]`);
                    if (techCell) {
                        const current = parseFloat(techCell.textContent) || 0;
                        techCell.textContent = (current + result.ballTech).toString();
                    }
                    if (result.hasValidEvent) {
                        const daysCell = document.querySelector(`tfoot td[data-counter-type="workdays"][data-engineer="inj${engIndex}"]`);
                        if (daysCell) {
                            const current = parseInt(daysCell.textContent) || 0;
                            daysCell.textContent = (current + 1).toString();
                        }
                    }
                }
            });
        }

        function countAssignedEngineers(rowIndex, venueCode, slot, eventName) {
            // Считает, сколько инженеров назначено на событие (по площадке, слоту и названию)
            let count = 0;
            const eventSlot = slot || 'evening';
            ['inj1', 'inj2', 'inj3'].forEach(engCol => {
                const engCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="${engCol}"]`);
                if (!engCell) return;
                const engValue = engCell.textContent.trim().toUpperCase();
                const engParts = engValue.split('+').map(p => p.trim());
                engParts.forEach(engPart => {
                    if (!engPart) return;
                    let engSlot = 'evening';
                    let cleanEngPart = engPart;
                    if (engPart.startsWith('У/')) {
                        engSlot = 'morning';
                        cleanEngPart = engPart.substring(2).trim();
                    } else if (engPart.startsWith('В/')) {
                        engSlot = 'evening';
                        cleanEngPart = engPart.substring(2).trim();
                    }
                    const venueMap = { 'БС': 'bs', 'МС': 'ms', 'КС': 'ks', 'ЗРК': 'zrk', 'ТГ': 'tg' };
                    let engVenue = '';
                    for (const [rus, code] of Object.entries(venueMap)) {
                        if (cleanEngPart.includes(rus)) {
                            engVenue = code;
                            break;
                        }
                    }
                    if (engVenue === venueCode && engSlot === eventSlot) {
                        count++;
                    }
                });
            });
            return count;
        }

        function updateVenueColors(rowIndex) {
            // Окрашивание ячеек площадок (ТЗ п. 4.3.4, Задание 4)
            const warnings = checkAssignmentRules(rowIndex);
            const hasBlockingError = warnings.some(w => w.type === 'error');
            ['bs', 'ms', 'ks', 'zrk', 'tg'].forEach(venueCode => {
                const venueCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="${venueCode}"]`);
                if (!venueCell) return;

                const venueValue = venueCell.textContent.trim();
                const events = parseVenueEvents(venueValue);

                venueCell.style.backgroundColor = '';
                venueCell.style.color = '';

                if (events.length === 0) {
                    venueCell.style.backgroundColor = '#ffffff';
                    venueCell.style.color = '#000000';
                    return;
                }

                let allFound = true;
                let allBallInjZero = true;

                events.forEach(event => {
                    const repData = repertoire[event.name];
                    if (!repData) {
                        allFound = false;
                    } else if (repData.ball_inj > 0) {
                        allBallInjZero = false;
                    }
                });

                if (!allFound) {
                    venueCell.style.backgroundColor = '#ffffff';
                    venueCell.style.color = '#000000';
                } else if (hasBlockingError) {
                    venueCell.style.backgroundColor = '#ffebee';
                    venueCell.style.color = '#000000';
                } else {
                    let fullCoverage = true;
                    events.forEach(event => {
                        const repData = repertoire[event.name];
                        if (!repData) {
                            fullCoverage = false;
                            return;
                        }
                        const timeObj = event.hour !== null ? { hour: event.hour, minute: event.minute || 0 } : null;
                        const eventSlot = isMorningSlot(timeObj) ? 'morning' : 'evening';
                        const assignedCount = countAssignedEngineers(rowIndex, venueCode, eventSlot, event.name);
                        if (assignedCount < repData.eng_count) {
                            fullCoverage = false;
                        }
                    });

                    if (fullCoverage && !allBallInjZero) {
                        venueCell.style.backgroundColor = '#fff9c4';
                        venueCell.style.color = '#000000';
                    } else if (fullCoverage && allBallInjZero) {
                        venueCell.style.backgroundColor = '#ffffff';
                        venueCell.style.color = '#ff6d00';
                    } else {
                        venueCell.style.backgroundColor = '#ffebee';
                        venueCell.style.color = '#000000';
                    }
                }
            });
        }

        function updateEngineerColors(rowIndex) {
            // Окрашивание ячеек инженеров (Задание 4):
            // слот совпал И ball_inj > 0 -> жёлтый; слот совпал И ball_inj = 0 -> базовый цвет + оранжевый текст;
            // слот не совпал -> розовый фон + оранжевый текст
            const baseColors = {
                'inj1': '#e8f5e9',
                'inj2': '#ffe8e1',
                'inj3': '#fffde7'
            };
            ['inj1', 'inj2', 'inj3'].forEach((engCol, engIndex) => {
                const engCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="${engCol}"]`);
                if (!engCell) return;

                const engValue = engCell.textContent.trim().toUpperCase();

                engCell.style.backgroundColor = baseColors[engCol];
                engCell.style.color = '#000000';

                if (!engValue) {
                    return;
                }

                const engParts = engValue.split('+').map(p => p.trim());
                let hasValidEvent = false;
                let allBallInjZero = true;
                let hasSlotError = false;

                engParts.forEach(engPart => {
                    if (!engPart) return;
                    let engSlot = 'evening';
                    let cleanEngPart = engPart;
                    if (engPart.startsWith('У/')) {
                        engSlot = 'morning';
                        cleanEngPart = engPart.substring(2).trim();
                    } else if (engPart.startsWith('В/')) {
                        engSlot = 'evening';
                        cleanEngPart = engPart.substring(2).trim();
                    }

                    const venueMap = { 'БС': 'bs', 'МС': 'ms', 'КС': 'ks', 'ЗРК': 'zrk', 'ТГ': 'tg' };
                    let engVenue = '';
                    for (const [rus, code] of Object.entries(venueMap)) {
                        if (cleanEngPart.includes(rus)) {
                            engVenue = code;
                            break;
                        }
                    }

                    if (!engVenue) return;

                    const venueCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="${engVenue}"]`);
                    if (!venueCell) return;

                    const venueValue = venueCell.textContent.trim();
                    const events = parseVenueEvents(venueValue);

                    events.forEach(event => {
                        const timeObj = event.hour !== null ? { hour: event.hour, minute: event.minute || 0 } : null;
                        const eventSlot = isMorningSlot(timeObj) ? 'morning' : 'evening';
                        if (eventSlot === engSlot) {
                            const repData = repertoire[event.name];
                            if (repData) {
                                hasValidEvent = true;
                                if (repData.ball_inj > 0) {
                                    allBallInjZero = false;
                                }
                            }
                        } else {
                            hasSlotError = true;
                        }
                    });
                });

                if (hasSlotError) {
                    engCell.style.backgroundColor = '#ffebee';
                    engCell.style.color = '#ff6d00';
                } else if (hasValidEvent && !allBallInjZero) {
                    engCell.style.backgroundColor = '#fff9c4';
                    engCell.style.color = '#000000';
                } else if (hasValidEvent && allBallInjZero) {
                    engCell.style.backgroundColor = baseColors[engCol];
                    engCell.style.color = '#ff6d00';
                }
            });
        }

        function recalculateAllRows() {
            const rows = document.querySelectorAll('tbody tr');
            rows.forEach((row, rowIndex) => {
                recalculateRow(rowIndex);
            });
            updateFootCounters();
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            
            setTimeout(() => {
                status.className = 'status';
            }, 3000);
        }
    </script>
