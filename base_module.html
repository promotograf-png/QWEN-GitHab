<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание — базовый модуль</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    :root {
        --bg-valid: #fff9c4;
        --col-inj1: #e8f5e9;
        --col-inj2: #ffe8e1;
        --col-inj3: #fffde7;
        --border-color: #d0d0d0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,sans-serif; background:#f4f6f8; padding:20px; color:#222; font-weight:bold; }
    .container { max-width:1600px; margin:0 auto; background:#fff; padding:25px; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,.05); }
    h1 { text-align:center; margin-bottom:20px; font-size:22px; }
    .controls { display:flex; gap:12px; margin-bottom:15px; align-items:center; flex-wrap:wrap; }
    input[type="file"] { display:none; }
    .file-label { padding:10px 18px; background:#9C27B0; color:#fff; border-radius:4px; cursor:pointer; font-size:14px; }
    .ctrl-label { font-size:14px; margin-left:10px; }
    #monthSelect, #yearInput { padding:8px 10px; border:1px solid #ccc; border-radius:4px; font-size:14px; font-weight:bold; background:#fff; }
    #yearInput { width:90px; }
    .status-msg { padding:10px; margin:10px 0; border-radius:4px; display:none; font-size:14px; }
    .status-ok { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
    .status-err { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
    .table-wrapper { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; min-width:1000px; }
    th, td { border:1px solid var(--border-color); padding:6px 8px; text-align:left; }
    th { background:#f8f9fa; position:sticky; top:0; z-index:10; white-space:nowrap; }
    .col-day-num { width:45px; text-align:center; background:#fafafa; }
    .col-day-name { width:45px; text-align:center; background:#fafafa; text-transform:uppercase; }
    .col-venue { width:150px; }
    .col-inj1 { background:var(--col-inj1); width:80px; text-align:center; }
    .col-inj2 { background:var(--col-inj2); width:80px; text-align:center; }
    .col-inj3 { background:var(--col-inj3); width:80px; text-align:center; }
    .valid-name { background-color:var(--bg-valid) !important; color:#000 !important; }
    .zero-coef { color:#ff6f00 !important; }
    td[contenteditable="true"] { cursor:text; outline:none; min-height:22px; }
    td[contenteditable="true"]:focus { box-shadow:inset 0 0 0 2px #2196F3; }
</style>
</head>
<body>
<div class="container">
    <h1>Расписание — базовый модуль</h1>
    <div class="controls">
        <label for="repFile" class="file-label">Загрузить Репертуар (Excel)</label>
        <input type="file" id="repFile" accept=".xlsx,.xls">

        <label class="ctrl-label" for="monthSelect">Месяц</label>
        <select id="monthSelect"></select>

        <label class="ctrl-label" for="yearInput">Год</label>
        <input type="number" id="yearInput" min="2000" max="2100">
    </div>
    <div id="statusMsg" class="status-msg"></div>
    <div class="table-wrapper">
        <table id="schedTable">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
/* =====================================================================
   БАЗОВЫЙ МОДУЛЬ
   Блок 0: период (месяц/год)
   Блок 1: построение таблицы Расписание
   Блок 2: загрузка таблицы Репертуар
   Блок 3: навигация по ячейкам
   Блок 4: идентификация ячеек со спектаклями из Репертуара
   ===================================================================== */
let repertuar = [];
const VENUES = ['БС','МС','КС','ЗРК','ТГ'];
const MONTHS = ['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ',
                'ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'];
let curMonth = 9;              // индекс месяца 0–11, по умолчанию ОКТЯБРЬ
let curYear = 2026;
const scheduleCache = {};      // введённые данные по каждому периоду

document.addEventListener('DOMContentLoaded', () => {
    initPeriodControls();      // сначала контролы периода
    buildTable();              // потом таблица
});

/* ---------- БЛОК 0. ПЕРИОД: МЕСЯЦ / ГОД ---------- */
function initPeriodControls(){
    const sel = document.getElementById('monthSelect');
    const yin = document.getElementById('yearInput');
    if (!sel || !yin) return;

    // Заполняем селект списка месяцев
    sel.innerHTML = '';
    MONTHS.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = m;
        sel.appendChild(opt);
    });
    sel.selectedIndex = curMonth;   // надёжнее, чем sel.value = ...
    yin.value = curYear;

    sel.addEventListener('change', () => {
        dumpTable();
        curMonth = sel.selectedIndex;
        buildTable();
    });

    yin.addEventListener('change', () => {
        const y = parseInt(yin.value, 10);
        if (!y || y < 2000 || y > 2100) { yin.value = curYear; return; }
        dumpTable();
        curYear = y;
        buildTable();
    });
}

// Сохранить введённое перед перестройкой таблицы
function dumpTable(){
    const data = {};
    document.querySelectorAll('#tableBody tr').forEach(row => {
        const d = row.dataset.day;
        row.querySelectorAll('td[contenteditable]').forEach(c => {
            const t = c.textContent.trim();
            if (t) data[d + '|' + cellKey(c)] = t;
        });
    });
    scheduleCache[curYear + '-' + curMonth] = data;
}

// Вернуть введённое для выбранного периода
function restoreTable(){
    const data = scheduleCache[curYear + '-' + curMonth];
    if (!data) return;
    document.querySelectorAll('#tableBody tr').forEach(row => {
        const d = row.dataset.day;
        row.querySelectorAll('td[contenteditable]').forEach(c => {
            const t = data[d + '|' + cellKey(c)];
            if (t) c.textContent = t;
        });
    });
    revalidateAll();
}

function cellKey(c){
    return c.dataset.venue || ('eng' + c.dataset.eng);
}

/* ---------- БЛОК 2. ЗАГРУЗКА РЕПЕРТУАРА ---------- */
document.getElementById('repFile').addEventListener('change', function(e){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt){
        try {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, {type:'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(ws, {header:1});
            parseRepertuar(json);
            revalidateAll();
            showStatus('✅ Загружено записей: ' + repertuar.length, 'ok');
        } catch(err){
            showStatus('❌ Ошибка: ' + err.message, 'err');
        }
    };
    reader.readAsArrayBuffer(file);
});

function parseRepertuar(data){
    repertuar = [];
    for (let i = 2; i < data.length; i++){
        const row = data[i];
        if (!row || !row[0]) continue;
        repertuar.push({
            normName: normalize(String(row[0])),
            cInj: parseFloat(row[1]) || 0
        });
    }
}

/* ---------- БЛОК 1. ПОСТРОЕНИЕ ТАБЛИЦЫ РАСПИСАНИЕ ---------- */
function buildTable(){
    const thead = document.getElementById('tableHeader');
    const tbody = document.getElementById('tableBody');

    let hHtml = '<th class="col-day-num">#</th><th class="col-day-name">ДЕНЬ</th>';
    VENUES.forEach(v => hHtml += '<th class="col-venue">' + v + '</th>');
    ['ИНЖ1','ИНЖ2','ИНЖ3'].forEach((e,i) => hHtml += '<th class="col-inj' + (i+1) + '">' + e + '</th>');
    thead.innerHTML = hHtml;

    const daysMap = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
    const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate(); // 28–31, високосные учтены
    let bHtml = '';
    for (let d = 1; d <= daysInMonth; d++){
        const date = new Date(curYear, curMonth, d);
        bHtml += '<tr data-day="' + d + '">';
        bHtml += '<td class="col-day-num">' + d + '</td>';
        bHtml += '<td class="col-day-name">' + daysMap[date.getDay()] + '</td>';
        VENUES.forEach(v => {
            bHtml += '<td class="col-venue" contenteditable="true" data-type="venue" data-venue="' + v + '"></td>';
        });
        [1,2,3].forEach(idx => {
            bHtml += '<td class="col-inj' + idx + '" contenteditable="true" data-type="eng" data-eng="' + idx + '"></td>';
        });
        bHtml += '</tr>';
    }
    tbody.innerHTML = bHtml;

    tbody.querySelectorAll('td[contenteditable]').forEach(cell => {
        cell.addEventListener('keydown', function(e){ handleKey(e, this); });
        cell.addEventListener('blur',    function(){ onCellBlur(this); });
        cell.addEventListener('focus',   function(){ placeCursorAtEnd(this); });
    });

    restoreTable(); // вернуть данные выбранного периода, если они есть
}

/* ---------- БЛОК 3. НАВИГАЦИЯ ПО ЯЧЕЙКАМ ---------- */
function handleKey(e, cell){
    if (e.key === 'Backspace') return;  // нативно: удаляет символ левее курсора
    if (e.key === 'Tab') return;        // нативно: следующая редактируемая ячейка

    if (e.key === 'Delete'){            // очистка текущей ячейки
        e.preventDefault();
        cell.textContent = '';
        onCellBlur(cell);
        return;
    }

    const rows = Array.from(document.querySelectorAll('#tableBody tr'));
    const curRowIdx = rows.indexOf(cell.parentElement);
    const cells = Array.from(cell.parentElement.querySelectorAll('td[contenteditable]'));
    const curCellIdx = cells.indexOf(cell);

    let target = null;
    if (e.key === 'ArrowLeft' && curCellIdx > 0){
        target = cells[curCellIdx - 1];
    } else if (e.key === 'ArrowRight' && curCellIdx < cells.length - 1){
        target = cells[curCellIdx + 1];
    } else if (e.key === 'ArrowUp' && curRowIdx > 0){
        target = rows[curRowIdx - 1].querySelectorAll('td[contenteditable]')[curCellIdx] || null;
    } else if ((e.key === 'ArrowDown' || e.key === 'Enter') && curRowIdx < rows.length - 1){
        target = rows[curRowIdx + 1].querySelectorAll('td[contenteditable]')[curCellIdx] || null;
    }

    if (target){
        e.preventDefault();   // для Enter — блокируем перенос строки
        e.stopPropagation();
        target.focus();
        placeCursorAtEnd(target);
    }
}

function placeCursorAtEnd(el){
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(el);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
}

/* ---------- БЛОК 4. ФИКСАЦИЯ И ИДЕНТИФИКАЦИЯ ЯЧЕЕК ---------- */
function onCellBlur(cell){
    cleanCellContent(cell);
    if (cell.dataset.type === 'venue') validateVenue(cell);
}

function cleanCellContent(cell){
    if (!cell) return;
    const text = (cell.innerText || cell.textContent).replace(/\s+/g,' ').trim();
    if (cell.textContent !== text) cell.textContent = text;
}

// найден + коэф>0 -> фон #fff9c4, текст черный
// найден + коэф=0 -> текст ярко-оранжевый, фон белый
// не найден       -> текст черный, фон белый
function validateVenue(cell){
    const txt = cell.textContent.trim();
    cell.classList.remove('valid-name','zero-coef');
    if (!txt) return;

    const parts = txt.split('+').map(p => extractCleanName(p)).filter(p => p);
    let foundPos = false, foundZero = false;

    parts.forEach(p => {
        const show = findInRepertuar(p);
        if (show){
            if (show.cInj > 0) foundPos = true;
            else foundZero = true;
        }
    });

    if (foundPos) cell.classList.add('valid-name');
    else if (foundZero) cell.classList.add('zero-coef');
}

function revalidateAll(){
    document.querySelectorAll('td[data-type="venue"]').forEach(c => {
        if (c.textContent.trim()) validateVenue(c);
    });
}

/* ---------- НОРМАЛИЗАЦИЯ И ПОИСК ---------- */
function normalize(str){
    return str ? String(str).toUpperCase().trim().replace(/\s+/g,' ').replace(/["']/g,'') : '';
}

function extractCleanName(raw){
    let s = normalize(raw);
    s = s.replace(/\s*\d{1,2}[.:]\d{2}/g,''); // время 19.00, 18:30
    s = s.replace(/\s*\b\d{1,2}\b/g,'');      // одиночные цифры (часы)
    return s.replace(/\s+/g,' ').trim();
}

function findInRepertuar(cleanName){
    if (!cleanName) return null;
    return repertuar.find(r => r.normName === cleanName);
}

/* ---------- СТАТУС ---------- */
function showStatus(msg, type){
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg status-' + type;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
}
</script>
</body>
</html>
