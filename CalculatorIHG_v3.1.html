<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График выхода инженеров _v3.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        label {
            font-weight: 500;
        }
        
        input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 80px;
        }
        
        button {
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #1976D2;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        
        .table-container {
            overflow-x: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            background: #f5f5f5;
            padding: 10px 8px;
            text-align: center;
            font-weight: 600;
            border: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: center;
            min-width: 100px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        td:hover {
            filter: brightness(0.95);
        }
        
        td:focus {
            outline: 2px solid #2196F3;
            outline-offset: -2px;
        }
        
        .col-date, .col-day {
            background: #fafafa;
            font-weight: 500;
            min-width: 60px;
        }
        
        .col-bs { background: white; }
        .col-ms { background: white; }
        .col-ks { background: white; }
        .col-zrk { background: white; }
        .col-tg { background: white; }
        .col-inj1 { background: #e8f5e9; }
        .col-inj2 { background: #ffe8e1; }
        .col-inj3 { background: #fffde7; }
        
        .editable {
            cursor: text;
        }
        
        .empty-row {
            background: #f9f9f9;
        }
        
        /* Стили для строк счетчиков */
        .counter-row {
            background: #f0f0f0;
            font-weight: 600;
        }
        
        .counter-label {
            text-align: right !important;
            padding-right: 15px !important;
            background: #e8e8e8 !important;
            font-weight: 600;
        }
        
        .counter-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            cursor: default !important;
        }
        
        .counter-value:hover {
            filter: none !important;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">График выхода инженеров _v3.1 в ........................</div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="month">Месяц:</label>
                    <input type="number" id="month" min="1" max="12" value="10">
                </div>
                
                <div class="control-group">
                    <label for="year">Год:</label>
                    <input type="number" id="year" min="2020" max="2030" value="2026">
                </div>
                
                <button id="generateBtn">Сгенерировать</button>
                
                <div class="file-input-wrapper">
                    <button id="loadRepertoireBtn">Загрузить Репертуар</button>
                    <input type="file" id="fileInput" accept=".xlsx,.xls">
                </div>
                
                <button id="exportBtn">Опубликовать в Гугл-таблицах</button>
            </div>
            
            <div id="status" class="status"></div>
        </div>
        
        <div class="table-container">
            <table id="scheduleTable">
                <thead>
                    <tr>
                        <th>Число</th>
                        <th>День</th>
                        <th>БС</th>
                        <th>МС</th>
                        <th>КС</th>
                        <th>ЗРК</th>
                        <th>ТГ</th>
                        <th>ИНЖ1</th>
                        <th>ИНЖ2</th>
                        <th>ИНЖ3</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Глобальное состояние
        let currentMonth = 10;
        let currentYear = 2026;
        let scheduleData = [];
        let repertoire = {}; // Ключ: название в UPPERCASE, значение: объект {ball_inj, ball_tech, eng_count, zn1, zn2, zn3}
        let currentCell = null;

        const DAYS_OF_WEEK = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 
                       'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            generateTable();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('generateBtn').addEventListener('click', generateTable);
            document.getElementById('loadRepertoireBtn').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });
            document.getElementById('fileInput').addEventListener('change', handleFileUpload);
            document.getElementById('exportBtn').addEventListener('click', exportToCSV);
            
            // Глобальная обработка клавиш
            document.addEventListener('keydown', handleKeyboardNavigation);
        }

        function generateTable() {
            currentMonth = parseInt(document.getElementById('month').value);
            currentYear = parseInt(document.getElementById('year').value);
            
            if (!currentMonth || currentMonth < 1 || currentMonth > 12) {
                showStatus('Неверный месяц', 'error');
                return;
            }
            
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            // Инициализируем массив данных если он пустой
            if (scheduleData.length === 0 || scheduleData[0]?.month !== currentMonth) {
                scheduleData = [];
            }
            
            // Создаем 35 строк (31 день + 4 резервные)
            for (let i = 0; i < 35; i++) {
                const row = document.createElement('tr');
                const dayNumber = i + 1;
                
                if (dayNumber <= daysInMonth) {
                    const date = new Date(currentYear, currentMonth - 1, dayNumber);
                    const dayOfWeek = DAYS_OF_WEEK[date.getDay()];
                    
                    // Ячейка с числом
                    const dateCell = document.createElement('td');
                    dateCell.className = 'col-date';
                    dateCell.textContent = dayNumber;
                    row.appendChild(dateCell);
                    
                    // Ячейка с днем недели
                    const dayCell = document.createElement('td');
                    dayCell.className = 'col-day';
                    dayCell.textContent = dayOfWeek;
                    row.appendChild(dayCell);
                    
                    // Ячейки площадок и инженеров
                    const columns = ['bs', 'ms', 'ks', 'zrk', 'tg', 'inj1', 'inj2', 'inj3'];
                    columns.forEach((col, idx) => {
                        const cell = document.createElement('td');
                        cell.className = `col-${col} editable`;
                        cell.contentEditable = true;
                        cell.dataset.row = i;
                        cell.dataset.col = idx + 2; // +2 потому что первые 2 колонки - число и день
                        cell.dataset.type = col;
                        
                        // Загружаем сохраненные данные
                        const savedData = scheduleData.find(d => d.day === dayNumber && d.column === col);
                        if (savedData) {
                            cell.textContent = savedData.value;
                        }
                        
                        cell.addEventListener('click', () => {
                            currentCell = cell;
                            placeCaretAtEnd(cell);
                        });
                        
                        cell.addEventListener('blur', () => {
                            saveCellData(cell);
                        });
                        
                        row.appendChild(cell);
                    });
                } else {
                    // Пустые строки
                    row.className = 'empty-row';
                    for (let j = 0; j < 10; j++) {
                        const cell = document.createElement('td');
                        if (j === 0) {
                            cell.className = 'col-date';
                        } else if (j === 1) {
                            cell.className = 'col-day';
                        } else {
                            cell.className = `col-${['bs', 'ms', 'ks', 'zrk', 'tg', 'inj1', 'inj2', 'inj3'][j-2]}`;
                        }
                        cell.textContent = '';
                        row.appendChild(cell);
                    }
                }
                
                tableBody.appendChild(row);
            }
            
            // Добавляем строки счетчиков
            addCounterRows(daysInMonth);
            
            showStatus(`Таблица сгенерирована для ${MONTHS[currentMonth - 1]} ${currentYear}`, 'success');
        }

        function addCounterRows(daysInMonth) {
            const tableBody = document.getElementById('tableBody');
            
            // Строка "Надбавки в баллах"
            const bonusesRow = document.createElement('tr');
            bonusesRow.className = 'counter-row';
            
            // Ячейка с надписью (объединяет 8 колонок: Число, День, БС, МС, КС, ЗРК, ТГ + одна для отступа)
            const bonusesLabel = document.createElement('td');
            bonusesLabel.className = 'counter-label';
            bonusesLabel.colSpan = 7;
            bonusesLabel.textContent = 'Надбавки в баллах';
            bonusesRow.appendChild(bonusesLabel);
            
            // Счетчики для ИНЖ1, ИНЖ2, ИНЖ3
            ['inj1', 'inj2', 'inj3'].forEach(col => {
                const counterCell = document.createElement('td');
                counterCell.className = `col-${col} counter-value`;
                counterCell.dataset.counterType = 'bonuses';
                counterCell.dataset.engineer = col;
                counterCell.textContent = daysInMonth; // Пока просто количество дней
                counterCell.contentEditable = false;
                bonusesRow.appendChild(counterCell);
            });
            
            tableBody.appendChild(bonusesRow);
            
            // Строка "Количество рабочих дней"
            const workDaysRow = document.createElement('tr');
            workDaysRow.className = 'counter-row';
            
            // Ячейка с надписью
            const workDaysLabel = document.createElement('td');
            workDaysLabel.className = 'counter-label';
            workDaysLabel.colSpan = 7;
            workDaysLabel.textContent = 'Количество рабочих дней';
            workDaysRow.appendChild(workDaysLabel);
            
            // Счетчики для ИНЖ1, ИНЖ2, ИНЖ3
            ['inj1', 'inj2', 'inj3'].forEach(col => {
                const counterCell = document.createElement('td');
                counterCell.className = `col-${col} counter-value`;
                counterCell.dataset.counterType = 'workdays';
                counterCell.dataset.engineer = col;
                counterCell.textContent = daysInMonth; // Пока просто количество дней
                counterCell.contentEditable = false;
                workDaysRow.appendChild(counterCell);
            });
            
            tableBody.appendChild(workDaysRow);
        }

        function updateCounters() {
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
            
            // Пока просто устанавливаем количество дней в месяце
            // В будущем здесь будет логика подсчета
            document.querySelectorAll('.counter-value').forEach(cell => {
                cell.textContent = daysInMonth;
            });
        }

        function parseCellEvents(cellValue, rowIndex) {
            if (!cellValue) return [];

            const events = [];
            const parts = cellValue.split('+').map(p => p.trim().toUpperCase());

            // Собираем события площадок для этой строки, чтобы привязать время
            const rowVenues = {};
            ['bs', 'ms', 'ks', 'zrk', 'tg'].forEach(venue => {
                const venueCell = document.querySelector(`td[data-row="${rowIndex}"][data-type="${venue}"]`);
                if (venueCell) {
                    rowVenues[venue] = venueCell.textContent.trim().toUpperCase();
                }
            });

            parts.forEach(part => {
                if (!part) return;

                let slot = 'evening'; // по умолчанию вечер
                let venueCode = '';
                let cleanPart = part;

                // Определяем слот
                if (part.startsWith('У/')) {
                    slot = 'morning';
                    cleanPart = part.substring(2).trim();
                } else if (part.startsWith('В/')) {
                    slot = 'evening';
                    cleanPart = part.substring(2).trim();
                }

                // Определяем код площадки из ввода
                const venueMap = { 'БС': 'bs', 'МС': 'ms', 'КС': 'ks', 'ЗРК': 'zrk', 'ТГ': 'tg' };
                for (const [rus, code] of Object.entries(venueMap)) {
                    if (cleanPart.includes(rus)) {
                        venueCode = code;
                        break;
                    }
                }

                // Ищем событие в репертуаре по содержимому ячейки площадки
                if (venueCode && rowVenues[venueCode]) {
                    const eventName = rowVenues[venueCode];
                    const repData = repertoire[eventName] || null;

                    events.push({
                        raw: part,
                        venue: venueCode,
                        slot: slot,
                        eventName: eventName,
                        repData: repData,
                        isValid: !!repData
                    });
                } else {
                    events.push({
                        raw: part,
                        venue: venueCode,
                        slot: slot,
                        eventName: null,
                        repData: null,
                        isValid: false
                    });
                }
            });

            return events;

        }
        function applyCellValidation(cell, status) {
            // Сброс базовых классов валидации
            cell.style.backgroundColor = '';
            cell.style.color = '';

        }

        function saveCellData(cell) {
            const row = parseInt(cell.dataset.row);
            const col = cell.dataset.type;
            const value = cell.textContent.trim();
            const dayNumber = row + 1;

            // 1. Парсим события для этой ячейки
            const parsedEvents = parseCellEvents(value, row);

            // 2. Определяем статус валидации
            let validationStatus = 'invalid';
            if (value === '') {
                validationStatus = 'empty';
            } else {
                const hasValidEvent = parsedEvents.some(e => e.isValid && e.repData && e.repData.ball_inj > 0);
                const allZero = parsedEvents.length > 0 && parsedEvents.every(e => e.isValid && e.repData && e.repData.ball_inj === 0);

                if (hasValidEvent) {
                    validationStatus = 'valid';
                } else if (allZero) {
                    validationStatus = 'zero';
                }
            }

            // 3. Обновляем массив данных с новыми полями
            scheduleData = scheduleData.filter(d => !(d.day === dayNumber && d.column === col));
            if (value) {
                scheduleData.push({
                    day: dayNumber,
                    column: col,
                    value: value,
                    parsedEvents: parsedEvents,
                    validationStatus: validationStatus,
                    month: currentMonth,
                    year: currentYear
                });
            }

            // 4. Применяем визуальную валидацию
            applyCellValidation(cell, validationStatus);

            // 5. Сохраняем и обновляем
            saveToLocalStorage();
            updateCounters();

        }

        function handleKeyboardNavigation(e) {
            if (!currentCell) return;
            
            const row = parseInt(currentCell.dataset.row);
            const col = parseInt(currentCell.dataset.col);
            
            // Проверяем, что это редактируемая ячейка (не счетчик)
            if (!currentCell.classList.contains('editable')) return;
            
            let nextCell = null;
            
            switch(e.key) {
                case 'ArrowLeft':
                    if (col > 2) {
                        nextCell = document.querySelector(`td[data-row="${row}"][data-col="${col - 1}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'ArrowRight':
                    if (col < 9) {
                        nextCell = document.querySelector(`td[data-row="${row}"][data-col="${col + 1}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'ArrowUp':
                    if (row > 0) {
                        nextCell = document.querySelector(`td[data-row="${row - 1}"][data-col="${col}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'ArrowDown':
                    if (row < 34) {
                        nextCell = document.querySelector(`td[data-row="${row + 1}"][data-col="${col}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'Tab':
                    if (col < 9) {
                        nextCell = document.querySelector(`td[data-row="${row}"][data-col="${col + 1}"]`);
                    } else if (row < 34) {
                        nextCell = document.querySelector(`td[data-row="${row + 1}"][data-col="2"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'Enter':
                    if (row < 34) {
                        nextCell = document.querySelector(`td[data-row="${row + 1}"][data-col="${col}"]`);
                    }
                    e.preventDefault();
                    break;
                    
                case 'Delete':
                    currentCell.textContent = '';
                    saveCellData(currentCell);
                    e.preventDefault();
                    break;
            }
            
            if (nextCell && nextCell.classList.contains('editable')) {
                currentCell = nextCell;
                nextCell.focus();
                placeCaretAtEnd(nextCell);
            }
        }

        function placeCaretAtEnd(el) {
            el.focus();
            if (window.getSelection && document.createRange) {
                const range = document.createRange();
                range.selectNodeContents(el);
                range.collapse(false);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    
                    processRepertoireData(jsonData);
                    showStatus('Репертуар успешно загружен', 'success');
                } catch (error) {
                    showStatus('Ошибка при загрузке файла: ' + error.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processRepertoireData(data) {
            repertoire = {};
            
            // Пропускаем заголовок (первая строка)
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length === 0) continue;
                
                // Столбец A: Название спектакля
                const name = row[0];
                if (!name) continue;
                
                // Приводим к UPPERCASE, удаляем кавычки и лишние пробелы
                const normalizedName = name.toString().toUpperCase().replace(/[“”"]/g, '').trim();
                if (!normalizedName) continue;
                
                // Столбец B: балл_инж
                const ball_inj = parseFloat(row[1]) || 0;
                
                // Столбец C: балл_тех
                const ball_tech = parseFloat(row[2]) || 0;
                
                // Столбец D: количество инженеров
                const eng_count = parseInt(row[3]) || 1;
                
                // Столбцы E, F, G: зн1, зн2, зн3
                const zn1 = row[4] ? row[4].toString().trim() : '+';
                const zn2 = row[5] ? row[5].toString().trim() : '+';
                const zn3 = row[6] ? row[6].toString().trim() : '+';
                
                // Сохраняем в объект repertoire
                repertoire[normalizedName] = {
                    ball_inj: ball_inj,
                    ball_tech: ball_tech,
                    eng_count: eng_count,
                    zn1: zn1,
                    zn2: zn2,
                    zn3: zn3
                };
            }
            
            console.log('Репертуар загружен:', repertoire);
            showStatus(`Репертуар загружен: ${Object.keys(repertoire).length} спектаклей`, 'success');
            
        }

        function exportToCSV() {
            const table = document.getElementById('scheduleTable');
            let csv = [];
            
            // Заголовок
            const headers = [];
            table.querySelectorAll('th').forEach(th => {
                headers.push('"' + th.textContent.replace(/"/g, '""') + '"');
            });
            csv.push(headers.join(','));
            
            // Данные (только основные строки, без счетчиков)
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach((tr, rowIndex) => {
                // Пропускаем строки счетчиков
                if (tr.classList.contains('counter-row')) return;
                
                const row = [];
                tr.querySelectorAll('td').forEach(td => {
                    row.push('"' + td.textContent.replace(/"/g, '""') + '"');
                });
                csv.push(row.join(','));
            });
            
            const csvString = csv.join('\n');
            const blob = new Blob(['\ufeff' + csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `график_выхода_инженеров_${MONTHS[currentMonth - 1]}_${currentYear}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showStatus('Файл CSV экспортирован. Загрузите его в Google Sheets.', 'success');
        }

        function saveToLocalStorage() {
            const data = {
                scheduleData: scheduleData,
                currentMonth: currentMonth,
                currentYear: currentYear
            };
            localStorage.setItem('engineerSchedule', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('engineerSchedule');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    scheduleData = data.scheduleData || [];
                    currentMonth = data.currentMonth || 10;
                    currentYear = data.currentYear || 2026;
                    
                    document.getElementById('month').value = currentMonth;
                    document.getElementById('year').value = currentYear;
                } catch (e) {
                    console.error('Ошибка загрузки из localStorage:', e);
                }
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            
            setTimeout(() => {
                status.className = 'status';
            }, 3000);
        }
    </script>
</body>
</html>
